# Publica o site no GitHub Pages deste repositório.
#
# PRÉVIA (padrão): https://gabrielfelixback.github.io/sitebacke/ , com "noindex" para não competir no Google.
# PRODUÇÃO: em Settings → Secrets and variables → Actions → Variables, criar a variável PRODUCTION = true.
#   A partir daí cada publicação sai para https://backe.com.br/ (sem noindex, com CNAME). O passo a passo
#   completo da troca de domínio está em LANCAMENTO.md.
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main, claude/funny-heisenberg-umdaca]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROD: ${{ vars.PRODUCTION == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (${{ vars.PRODUCTION == 'true' && 'produção backe.com.br' || 'prévia github.io' }})
        run: npm run build
        env:
          SITE_URL: ${{ vars.PRODUCTION == 'true' && 'https://backe.com.br' || 'https://gabrielfelixback.github.io' }}
          BASE_PATH: ${{ vars.PRODUCTION == 'true' && '/' || '/sitebacke' }}
          PUBLIC_PREVIEW: ${{ vars.PRODUCTION == 'true' && 'false' || 'true' }}
      - name: Domínio próprio (só produção)
        if: env.PROD == 'true'
        run: echo "backe.com.br" > dist/CNAME
      - name: Trava de segurança (produção sem noindex e apontando para backe.com.br)
        if: env.PROD == 'true'
        run: |
          if grep -q 'name="robots" content="noindex' dist/index.html; then echo "::error::produção saiu com noindex"; exit 1; fi
          grep -q 'rel="canonical" href="https://backe.com.br/"' dist/index.html || { echo "::error::canonical errado"; exit 1; }
          grep -q 'src="/_astro/' dist/index.html || { echo "::error::caminhos dos scripts não estão na raiz"; exit 1; }
          echo "ok: produção pronta para backe.com.br"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
