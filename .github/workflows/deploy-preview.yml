# Publica o site no GitHub Pages (preview): https://gabrielfelixback.github.io/sitebacke/
# A versão de preview sai com "noindex" para não competir com backe.com.br no Google.
name: Deploy preview (GitHub Pages)

on:
  push:
    branches: [main, claude/funny-heisenberg-umdaca]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://gabrielfelixback.github.io
          BASE_PATH: /sitebacke
          PUBLIC_PREVIEW: 'true'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
